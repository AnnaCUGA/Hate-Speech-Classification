<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" role="img" aria-labelledby="t">
  <title id="t">Precisión por clase: Religión 0.916, Origen 0.894, Racismo 0.892, No odio 0.815, Sexismo 0.732, Orientación 0.649. Las dos clases con menor precisión son también las que tienen menos mensajes.</title>
  <defs><style>
      .k { font: 600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7fe0c9; }
